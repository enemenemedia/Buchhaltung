# Baut das Docker-Image der Netzwerkversion (amd64 + arm64) und veröffentlicht es unter
# ghcr.io/enemenemedia/buchhaltung – bei Änderungen auf main, bei Tags „v*“ und auf Knopfdruck.
# Die Versionsnummer kommt aus app/__init__.py (__version__).
name: Netzwerkversion (Docker-Image)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "netzwerk/**"
      - "requirements-netzwerk.txt"
      - ".github/workflows/netzwerk-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt gunicorn cheroot
      - run: python -m pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' app/__init__.py)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/buchhaltung
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: netzwerk/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
