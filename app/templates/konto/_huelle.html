<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}{{ PROGRAMM_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen"><span class="marke">Buchhaltung <span>für KMU</span></span></div>
  </header>
  <main class="inhalt">
    {% with meldungen = get_flashed_messages(with_categories=true) %}
      {% for art, text in meldungen %}<div class="meldung meldung-{{ art }}" role="status">{{ text }}</div>{% endfor %}
    {% endwith %}
    <section class="karte entsperren">
      {% block inhalt %}{% endblock %}
    </section>
  </main>
  <footer class="fuss"><span>{{ PROGRAMM_NAME }} {{ PROGRAMM_VERSION }} · Netzwerkversion</span></footer>
</body>
</html>
